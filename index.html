<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>P2Per — Coming Soon</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #F0B90B;
      --gold-dim: #c9960a;
      --gold-glow: rgba(240, 185, 11, 0.18);
      --bg: #0B0E11;
      --surface: #13171C;
      --surface2: #1E2329;
      --border: rgba(240, 185, 11, 0.15);
      --text: #EAECEF;
      --muted: #848E9C;
      --danger: #F6465D;
      --green: #0ECB81;
    }

    html, body {
      height: 100%;
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    /* ── Background grid ── */
    .bg-grid { display: none; }

    /* ── Animated bg glow orbs ── */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      z-index: 0;
      animation: drift 14s ease-in-out infinite alternate;
    }
    .orb { display: none; }

    /* ── Landing content (behind modal) ── */
    .landing {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1;
      transition: filter 0.5s ease, opacity 0.5s ease;
      padding: 24px;
    }
    .landing.blurred {
      filter: blur(8px) brightness(0.45);
      pointer-events: none;
      user-select: none;
    }

    /* Logo */
    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 48px;
    }
    .logo-icon {
      width: 52px; height: 52px;
      background: var(--surface2);
      border: 1.5px solid rgba(240,185,11,0.4);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 500;
      font-size: 20px;
      color: var(--gold);
      letter-spacing: -1px;
      box-shadow: 0 0 20px rgba(240,185,11,0.15), inset 0 1px 0 rgba(240,185,11,0.08);
    }
    .logo-text {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--gold);
    }
    .logo-text span { color: var(--gold); }

    /* Hero numbers (fake live data feel) */
    .stats-row {
      display: flex;
      gap: 40px;
      margin-bottom: 56px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .stat {
      text-align: center;
    }
    .stat-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 28px;
      font-weight: 500;
      color: var(--gold);
      letter-spacing: -0.5px;
    }
    .stat-val.green { color: var(--green); }
    .stat-label {
      font-size: 11px;
      font-weight: 400;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1.2px;
      margin-top: 4px;
      font-family: 'JetBrains Mono', monospace;
    }

    /* Fake order book rows */
    .orderbook {
      width: 100%;
      max-width: 520px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .ob-header {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    .ob-header span:last-child, .ob-row span:last-child { text-align: right; }
    .ob-header span:nth-child(2), .ob-row span:nth-child(2) { text-align: center; }
    .ob-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      padding: 8px 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      position: relative;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }
    .ob-row.sell span:first-child { color: var(--danger); }
    .ob-row.buy span:first-child { color: var(--green); }
    .ob-row span:last-child, .ob-row span:nth-child(2) { color: var(--muted); }
    .ob-fill {
      position: absolute;
      top: 0; bottom: 0;
      right: 0;
      opacity: 0.08;
      pointer-events: none;
    }
    .sell .ob-fill { background: var(--danger); }
    .buy .ob-fill { background: var(--green); }
    .ob-mid {
      padding: 10px 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 18px;
      font-weight: 500;
      color: var(--gold);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .ob-mid-label { font-size: 11px; color: var(--muted); font-weight: 400; }

    /* ── Modal overlay ── */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal {
      background: var(--surface);
      border: 1px solid rgba(240,185,11,0.25);
      border-radius: 20px;
      padding: 44px 40px 44px;
      max-width: 380px;
      width: 100%;
      position: relative;
      overflow: hidden;
      text-align: center;
      box-shadow:
        0 0 0 1px rgba(240,185,11,0.08),
        0 40px 80px rgba(0,0,0,0.6),
        0 0 60px rgba(240,185,11,0.06);
      animation: modalIn 0.55s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes modalIn {
      from { opacity: 0; transform: translateY(28px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Scan line — travels around the card border */
    .scan-line {
      position: absolute;
      inset: 0;
      border-radius: 20px;
      pointer-events: none;
      overflow: hidden;
    }
    .scan-line::before {
      content: '';
      position: absolute;
      width: 60px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      box-shadow: 0 0 10px var(--gold), 0 0 20px rgba(240,185,11,0.4);
      animation: border-travel 4s linear infinite;
      offset-path: inset(0 round 20px);
      offset-distance: 0%;
    }
    @keyframes border-travel {
      0%   { offset-distance: 0%; }
      100% { offset-distance: 100%; }
    }

    /* Corner accents removed */
    .modal::before, .modal::after { display: none; }

    .modal-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(240,185,11,0.1);
      border: 1px solid rgba(240,185,11,0.25);
      border-radius: 20px;
      padding: 4px 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--gold);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 24px;
      margin-left: auto;
      margin-right: auto;
    }
    .badge-dot {
      width: 6px; height: 6px;
      background: var(--gold);
      border-radius: 50%;
      animation: pulse-dot 1.5s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.7); }
    }

    .modal-title {
      font-size: 38px;
      font-weight: 700;
      letter-spacing: -1px;
      line-height: 1.1;
      margin-bottom: 12px;
    }
    .modal-title span { color: var(--gold); }

    .modal-sub {
      font-size: 15px;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 0;
      font-weight: 400;
    }

    /* Feature tags */
    .feature-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 32px;
    }
    .tag {
      background: var(--surface2);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 6px;
      padding: 5px 12px;
      font-size: 12px;
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
      display: flex; align-items: center; gap: 6px;
    }
    .tag-icon { font-size: 11px; }

    /* Notify input row */
    .notify-row {
      display: flex;
      gap: 8px;
    }
    .notify-input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 14px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      transition: border-color 0.2s;
    }
    .notify-input::placeholder { color: var(--muted); }
    .notify-input:focus { border-color: rgba(240,185,11,0.4); }

    .notify-btn {
      background: var(--gold);
      color: var(--bg);
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      white-space: nowrap;
      transition: background 0.2s, transform 0.1s;
    }
    .notify-btn:hover { background: #f5c842; }
    .notify-btn:active { transform: scale(0.97); }

    .modal-footer {
      margin-top: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .footer-logo {
      display: flex; align-items: center; gap: 8px;
    }
    .footer-logo-icon {
      width: 26px; height: 26px;
      background: var(--surface2);
      border: 1px solid rgba(240,185,11,0.35);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 500;
      color: var(--gold);
    }
    .footer-logo-text {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }
    .footer-logo-text span { color: var(--gold); }
    .footer-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--muted);
    }

    @media (max-width: 480px) {
      .modal { padding: 32px 24px 28px; }
      .modal-title { font-size: 30px; }
      .stats-row { gap: 24px; }
      .stat-val { font-size: 20px; }
      .notify-row { flex-direction: column; }
    }
  </style>
</head>
<body>

  <div class="bg-grid"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <!-- Landing page (gets blurred) -->

    <div class="logo-wrap">

      <div class="ob-mid">

  </div>

  <!-- Modal overlay -->
  <div class="overlay" id="overlay">
    <div class="modal">
      <div class="scan-line"></div>

      <div class="modal-title"><span>P2Per</span> is<br>Coming Soon.</div>


    </div>
  </div>

  <script></script>

</body>
</html>
