const tgUser = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user : null;

// ── CONSTANTS ──────────────────────────────────────────────

const PAY_METHODS = ['Bank Transfer','PayPal','Revolut','Wise','Cash App','Venmo','Zelle'];

  {sym:'BTC/USDT',price:'67,420',change:'+2.34%',up:true},
  {sym:'ETH/USDT',price:'3,840',change:'+1.18%',up:true},
  {sym:'SOL/USDT',price:'182.4',change:'+5.67%',up:true},

];
const NAMES = ['CryptoKing','SatsStacker','EthWizard','SolSurfer','VaultMaster','DeFiDave','ChainChaser','Blocksmith'];

function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function rndF(a,b,d){d=d||2;return parseFloat((Math.random()*(b-a)+a).toFixed(d));}
function aColor(n){return COLORS[n.charCodeAt(0)%COLORS.length];}
function ini(n){return n[0].toUpperCase();}

function makeOffers(){
  var o=[];
  COINS.forEach(function(coin){
    for(var i=0;i<6;i++){
      var isBuy=i<3;
      var pr=PRICES[coin];
      var prem=rndF(-0.02,0.08);
      var op=+(pr*(1+prem)).toFixed(coin==='USDT'?4:2);
      var un=NAMES[rnd(0,NAMES.length-1)];
      o.push({
        id:coin+(isBuy?'-B':'-S')+i,
        type:isBuy?'buy':'sell',coin:coin,price:op,
        minAmount:rnd(20,200),maxAmount:rnd(500,5000),
        payMethods:[PAY_METHODS[rnd(0,PAY_METHODS.length-1)]],
        username:un,trades:rnd(12,890),completion:rnd(88,100),
        rating:rndF(4.3,5.0,1),online:Math.random()>.4,avgTime:rnd(3,30)
      });
    }
  });
  return o;
}

function render(){
  try{ root.innerHTML = buildApp(); bindEvents(); }
  catch(e){ root.innerHTML='<div style="color:#00e5a0;padding:20px;font-family:monospace;background:#0a0b0f;height:100vh"><h2>JS Error</h2><pre>'+e.message+'</pre><pre>'+e.stack+'</pre></div>'; }
}

function toast(msg,type){
  type=type||'success';
  S.toast={msg:msg,type:type};
  render();
  setTimeout(function(){S.toast=null;render();},2600);
}

// ── BUILD APP ──────────────────────────────────────────────
function buildApp(){
  var showNav = S.user && S.page!=='landing' && S.page!=='auth';
  var unread = S.notifications.filter(function(n){return !n.read;}).length;
  return (S.toast?'<div class="toast toast-'+S.toast.type+'">'+S.toast.msg+'</div>':'')
    +(S.tradeModal?buildTradeModal():'')
    +(S.postModal?buildPostModal():'')
    +(S.ratingModal?buildRatingModal():'')
    +(S.notifOpen?buildNotifPanel():'')
    +buildPage()
    +(showNav?buildNav(unread):'');
}

function buildNav(unread){
  var tabs=[{id:'p2p',label:'P2P'},{id:'trades',label:'Trades'},{id:'profile',label:'Profile'}];
  return '<nav class="bottom-nav">'+tabs.map(function(t){
    var icon=t.id==='p2p'?iconP2P():t.id==='trades'?iconTrades():iconProfile();
    var badge=t.id==='trades'&&unread>0?'<span style="position:absolute;top:-4px;right:-6px;background:var(--danger);color:#fff;border-radius:50%;width:14px;height:14px;font-size:8px;display:flex;align-items:center;justify-content:center;font-weight:800">'+unread+'</span>':'';
    return '<button class="nav-btn'+(S.page===t.id?' active':'')+'" data-nav="'+t.id+'"><div style="position:relative;display:inline-flex">'+icon+badge+'</div><span>'+t.label+'</span></button>';
  }).join('')+'</nav>';
}

function buildPage(){
  if(S.page==='landing') return buildLanding();
  if(S.page==='auth')    return buildAuth();
  if(S.page==='p2p')     return buildP2P();
  if(S.page==='escrow')  return buildEscrow();
  if(S.page==='trades')  return buildTrades();
  if(S.page==='profile') return buildProfile();
  return buildLanding();
}

// ── AUTH ───────────────────────────────────────────────────
function calcStrength(pw){
  var s=0;
  if(pw.length>=8)s++;if(/[A-Z]/.test(pw))s++;if(/[0-9]/.test(pw))s++;if(/[^A-Za-z0-9]/.test(pw))s++;
  var c=['#ff4560','#ffb800','#0070f3','#00e5a0'];var p=[20,50,75,100];
  return{pct:pw.length?p[s-1]||15:0,color:c[s-1]||'#ff4560'};
}
function buildAuth(){
  var isL=S.authTab==='login';
  var f=isL?S.loginForm:S.signupForm;
  var str=calcStrength(f.password||'');
  return '<div class="page"><div class="auth-wrap">'
    +'<div class="auth-title fade-up">'+(isL?'Welcome back 👋':'Create account')+'</div>'
    +'<div class="auth-subtitle fade-up-1">'+(isL?'Sign in to your SwapGuard account.':'Set up your account to start trading.')+'</div>'
    +'<div class="tab-row fade-up-1"><button class="tab-btn'+(isL?' active':'')+'" id="tab-login">Sign In</button><button class="tab-btn'+(!isL?' active':'')+'" id="tab-signup">Sign Up</button></div>'
    +(tgUser?'<button class="tg-auth-btn fade-up-1" id="tg-auth">'+iconTG()+' Continue as @'+(tgUser.username||tgUser.first_name)+'</button><div class="divider fade-up-2"><div class="divider-line"></div><div class="divider-text">or with email</div></div>':'')
    +'<div class="fade-up-2">'
    +(!isL?'<div class="input-group"><label class="input-label">Username</label><input class="input" type="text" id="f-username" placeholder="@satoshi" value="'+S.signupForm.username+'"/></div>':'')
    +'<div class="input-group"><label class="input-label">Email</label><input class="input" type="email" id="f-email" placeholder="you@example.com" value="'+f.email+'"/></div>'
    +'<div class="input-group"><label class="input-label">Password</label><div class="input-with-icon"><input class="input" type="'+(S.showPw?'text':'password')+'" id="f-password" placeholder="••••••••" value="'+f.password+'"/><button class="input-eye" id="toggle-pw">'+(S.showPw?'🙈':'👁️')+'</button></div>'

    +'<div style="padding:16px 16px 0"><div style="font-size:20px;font-weight:800;margin-bottom:4px">'+t.coin+' Escrow Trade</div><div style="font-size:12px;color:var(--text2);font-family:var(--mono)">ID: '+t.id+'</div></div>'
    +'<div style="padding:20px 0"><div class="escrow-progress">'+steps.map(function(s,i){
      return (i>0?'<div class="escrow-line'+(i<=si?' done':'')+'"></div>':'')
        +'<div class="escrow-step"><div class="escrow-step-dot'+(i<si?' done':i===si?' active':'')+'">'+( i<si?'✓':i+1)+'</div><div class="escrow-step-label'+(i===si?' active':'')+'">'+s+'</div></div>';
    }).join('')+'</div></div>'

      return '<div class="info-row"><span class="info-label">'+r[0]+'</span><span style="font-family:var(--mono);font-size:13px;font-weight:700">'+r[1]+'</span></div>';
    }).join('')+'</div>'
    +buildEscrowActions(t,isBuyer)

    +(t.status!=='released'&&t.status!=='disputed'?'<div style="padding:0 16px 16px"><button class="btn btn-danger" id="open-dispute">⚠️ Open Dispute</button></div>':'')
    +'</div></div>';

function buildEscrowActions(t,isBuyer){
  if(t.status==='created') return '<div class="card"><div class="card-title" style="margin-bottom:12px">Next Step</div><div class="warning-box">⏳ Waiting for seller to lock crypto in escrow.</div>'+(isBuyer?'':'<button class="btn btn-primary" id="lock-escrow">🔐 Lock '+t.cryptoAmt+' '+t.coin+' in Escrow</button>')+'</div>';
  if(t.status==='locked') return '<div class="card"><div class="card-title" style="margin-bottom:12px">'+(isBuyer?'Send Payment':'Awaiting Payment')+'</div>'+(isBuyer?'<div style="background:var(--surface2);border-radius:var(--radius-sm);padding:12px;margin-bottom:14px;border:1px solid var(--border)"><div style="font-size:11px;color:var(--text3);margin-bottom:4px">SEND EXACTLY</div><div style="font-size:22px;font-weight:800;font-family:var(--mono);color:var(--accent)">$'+t.fiatAmt+'</div><div style="font-size:13px;color:var(--text2);margin-top:4px">via '+t.payMethod+' to @'+t.counterparty+'</div></div><button class="btn btn-primary" id="confirm-paid">✅ I\'ve Sent the Payment</button>':'<div class="warning-box">⏳ Waiting for buyer to send $'+t.fiatAmt+' via '+t.payMethod+'</div>')+'</div>';
  if(t.status==='paid') return '<div class="card"><div class="card-title" style="margin-bottom:12px">'+(isBuyer?'Payment Sent!':'Confirm Payment')+'</div>'+(isBuyer?'<div class="warning-box" style="background:rgba(0,229,160,.07);border-color:rgba(0,229,160,.2);color:var(--accent)">✅ Payment sent. Waiting for seller to release.</div>':'<div style="font-size:13px;color:var(--text2);margin-bottom:14px;line-height:1.6">Buyer claims to have sent $'+t.fiatAmt+'. Verify receipt then release.</div><button class="btn btn-primary" id="release-escrow">🚀 Release Escrow Funds</button>')+'</div>';
  if(t.status==='released') return '<div class="card" style="border-color:rgba(0,229,160,.3)"><div style="text-align:center;padding:12px 0"><div style="font-size:40px;margin-bottom:10px">🎉</div><div style="font-size:18px;font-weight:800;color:var(--accent);margin-bottom:6px">Trade Complete!</div><div style="font-size:13px;color:var(--text2)">'+(isBuyer?t.cryptoAmt+' '+t.coin+' sent to your wallet':'$'+t.fiatAmt+' received')+'</div></div></div>';
  if(t.status==='disputed') return '<div class="card" style="border-color:rgba(255,69,96,.3)"><div class="warning-box" style="margin-bottom:0">⚠️ Dispute opened. Support will contact both parties within 24h.</div></div>';
  return '';
}

function buildTradeChat(t){
  var msgs=(t.messages||[]);
  return '<div class="card"><div class="card-header"><div class="card-title">💬 Trade Chat</div></div>'
    +'<div id="chat-msgs" style="max-height:160px;overflow-y:auto;margin-bottom:12px;display:flex;flex-direction:column;gap:6px">'
    +(msgs.length===0?'<div style="text-align:center;font-size:12px;color:var(--text3);padding:12px">No messages yet</div>':msgs.map(function(m){
      var me=m.from===(S.user?S.user.username:'');
      return '<div style="display:flex;justify-content:'+(me?'flex-end':'flex-start')+'"><div style="max-width:80%;padding:7px 11px;border-radius:'+(me?'14px 14px 4px 14px':'14px 14px 14px 4px')+';background:'+(me?'rgba(0,229,160,.15)':'var(--surface2)')+';border:1px solid '+(me?'rgba(0,229,160,.25)':'var(--border2)')+';font-size:13px">'+(!me?'<div style="font-size:10px;color:var(--text3);margin-bottom:2px">@'+m.from+'</div>':'')+m.text+'<div style="font-size:9px;color:var(--text3);margin-top:3px;text-align:right">'+m.time+'</div></div></div>';
    }).join(''))
    +'</div><div style="display:flex;gap:8px"><input class="input" id="chat-input" placeholder="Type a message…" style="flex:1;padding:10px 12px;font-size:13px"/><button class="btn btn-primary btn-sm" id="chat-send" style="width:auto;padding:10px 16px">Send</button></div></div>';
}

// ── MY TRADES ──────────────────────────────────────────────
function buildTrades(){
  var icons={BTC:'₿',ETH:'Ξ',USDT:'$',SOL:'◎',TON:'💎',MATIC:'⬡'};
  var sc={created:'badge-blue',locked:'badge-orange',paid:'badge-blue',released:'badge-green',disputed:'badge-red'};
  return '<div><div class="topbar"><div class="topbar-logo">My <span>Trades</span></div><span class="badge badge-gray">'+S.trades.length+' total</span></div>'
    +'<div class="page">'
    +(S.trades.length===0?'<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-text">No trades yet.<br/>Go to P2P to start!</div></div><div style="padding:0 16px"><button class="btn btn-primary" id="go-p2p">Browse Offers</button></div>':S.trades.map(function(t){
      return '<div class="trade-item" data-trade-view="'+t.id+'"><div class="trade-icon" style="background:'+aColor(t.coin)+'22;color:'+aColor(t.coin)+'">'+(icons[t.coin]||'🪙')+'</div><div class="trade-info"><div class="trade-title">'+(t.type==='buy'?'Bought':'Sold')+' '+t.coin+' from @'+t.counterparty+'</div><div class="trade-date">'+t.date+' · <span class="badge '+(sc[t.status]||'badge-gray')+'" style="padding:1px 6px;font-size:9px">'+t.status+'</span></div></div><div class="trade-amount"><div class="trade-crypto" style="color:'+(t.type==='buy'?'var(--accent)':'var(--danger)')+'">'+( t.type==='buy'?'+':'−')+t.cryptoAmt+' '+t.coin+'</div><div class="trade-fiat">$'+t.fiatAmt+'</div></div></div>';
    }).join(''))
    +'</div></div>';
}

// ── PROFILE ────────────────────────────────────────────────
function buildProfile(){
  var u=S.user||{username:'Guest',completedTrades:0,rating:'New'};
  return '<div><div class="topbar"><div class="topbar-logo">My <span>Profile</span></div><button class="btn btn-sm btn-ghost" id="logout-btn" style="padding:7px 12px;font-size:12px">Log Out</button></div>'
    +'<div class="page"><div class="profile-header fade-up"><div class="profile-avatar-big" style="background:'+aColor(u.username)+'22;color:'+aColor(u.username)+'">'+ini(u.username)+'</div>'
    +'<div><div class="profile-name">'+u.username+'</div><div class="profile-handle">@'+u.username.toLowerCase()+'</div><div class="profile-stats"><div><div class="pstat-val">'+(u.completedTrades||0)+'</div><div class="pstat-label">Trades</div></div><div><div class="pstat-val">'+(u.rating||'New')+'</div><div class="pstat-label">Rating</div></div><div><div class="pstat-val">0%</div><div class="pstat-label">Disputes</div></div></div></div></div>'
    +'<div style="padding:6px 0">'
    +[{i:'🔐',bg:'rgba(0,229,160,.1)',t:'Security',s:'2FA, password'},
      {i:'💳',bg:'rgba(0,112,243,.1)',t:'Payment Methods',s:'Bank, PayPal, cards'},
      {i:'📊',bg:'rgba(247,147,26,.1)',t:'Trade History',s:S.trades.length+' trades'},
      {i:'🛡️',bg:'rgba(168,85,247,.1)',t:'KYC Verification',s:'Increase limits'},
      {i:'🔔',bg:'rgba(6,182,212,.1)',t:'Notifications',s:'Alerts & email'},
      {i:'📖',bg:'rgba(126,142,168,.1)',t:'Help & Support',s:'FAQ, live chat'}
    ].map(function(m){return '<div class="menu-item"><div class="menu-icon" style="background:'+m.bg+'">'+m.i+'</div><div class="menu-text"><div class="menu-title">'+m.t+'</div><div class="menu-sub">'+m.s+'</div></div><div style="color:var(--text3)">›</div></div>';}).join('')
    +'</div><div style="padding:16px;text-align:center;font-size:11px;color:var(--text3)">SwapGuard v1.0.0 · Secured by escrow</div>'
    +'</div></div>';
}

// ── RATING MODAL ───────────────────────────────────────────
function buildRatingModal(){
  var t=S.escrowTrade||{counterparty:'Trader',type:'buy'};
  return '<div class="modal-overlay"><div class="modal-sheet"><div class="modal-handle"></div>'
    +'<div class="modal-title">⭐ Rate your Trader</div><div class="modal-body">'
    +'<div style="text-align:center;padding:12px 0 20px"><div style="font-size:36px;margin-bottom:10px">'+(t.type==='buy'?'🛍️':'💰')+'</div>'
    +'<div style="font-size:15px;font-weight:700;margin-bottom:4px">@'+t.counterparty+'</div>'
    +'<div style="font-size:12px;color:var(--text2)">How was your experience?</div>'
    +'<div style="display:flex;justify-content:center;gap:12px;margin-top:20px">'
    +[1,2,3,4,5].map(function(s){return '<button class="rating-star" data-star="'+s+'" style="background:none;border:none;cursor:pointer;font-size:32px;'+(S.pendingRating>=s?'':'filter:grayscale(1) opacity(.4)')+'">⭐</button>';}).join('')
    +'</div></div>'
    +'<button class="btn btn-primary" id="submit-rating">Submit Rating</button>'
    +'<button class="btn btn-secondary" style="margin-top:10px" id="close-rating">Skip</button>'
    +'</div></div></div>';
}

// ── NOTIF PANEL ────────────────────────────────────────────
function buildNotifPanel(){
  return '<div class="modal-overlay"><div class="modal-sheet"><div class="modal-handle"></div>'
    +'<div style="display:flex;align-items:center;justify-content:space-between;padding:0 20px 16px;border-bottom:1px solid var(--border)"><div style="font-size:17px;font-weight:800">Notifications</div><button id="close-notif" style="background:none;border:none;color:var(--text2);font-size:20px;cursor:pointer">✕</button></div>'
    +'<div style="padding:8px 0;max-height:70vh;overflow-y:auto">'
    +(S.notifications.length===0?'<div class="empty-state"><div class="empty-icon">🔔</div><div class="empty-text">No notifications</div></div>':S.notifications.map(function(n){
      var icons2={system:'📢',trade:'🔐',payment:'💸',release:'🎉',dispute:'⚠️'};
      return '<div style="display:flex;gap:12px;padding:14px 20px;border-bottom:1px solid var(--border);'+(n.read?'':'background:rgba(0,229,160,.03)')+'"><div style="width:36px;height:36px;border-radius:10px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0">'+(icons2[n.type]||'📢')+'</div><div style="flex:1"><div style="font-size:13px;font-weight:700;margin-bottom:3px">'+n.title+'</div><div style="font-size:12px;color:var(--text2);line-height:1.5">'+n.body+'</div><div style="font-size:10px;color:var(--text3);margin-top:4px">'+n.time+'</div></div>'+(n.read?'':'<div style="width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0;margin-top:4px"></div>')+'</div>';
    }).join(''))
    +'</div></div></div>';
}

// ── EVENTS ─────────────────────────────────────────────────
function bindEvents(){
  // nav
  document.querySelectorAll('[data-nav]').forEach(function(el){
    el.addEventListener('click',function(){S.page=el.dataset.nav;render();});
  });
  // landing
  var e;
  e=document.getElementById('cta-start'); if(e) e.addEventListener('click',function(){S.page=S.user?'p2p':'auth';render();});
  e=document.getElementById('cta-browse'); if(e) e.addEventListener('click',function(){S.page=S.user?'p2p':'auth';render();});
  // auth tabs
  e=document.getElementById('tab-login'); if(e) e.addEventListener('click',function(){S.authTab='login';render();});
  e=document.getElementById('tab-signup'); if(e) e.addEventListener('click',function(){S.authTab='signup';render();});
  // tg auth
  e=document.getElementById('tg-auth'); if(e) e.addEventListener('click',function(){
    S.user={id:tgUser.id,username:tgUser.username||tgUser.first_name||'TGUser',email:'tg@user',completedTrades:0,rating:'New'};
    S.page='p2p';render();toast('Welcome! 🎉');
  });
  // form fields
  ['f-username','f-email','f-password'].forEach(function(id){
    var el=document.getElementById(id); if(!el) return;
    el.addEventListener('input',function(ev){
      var k=id.replace('f-','');
      if(S.authTab==='login') S.loginForm[k]=ev.target.value;
      else S.signupForm[k]=ev.target.value;
    });
  });
  e=document.getElementById('toggle-pw'); if(e) e.addEventListener('click',function(){S.showPw=!S.showPw;render();});
  e=document.getElementById('auth-submit'); if(e) e.addEventListener('click',function(){
    if(S.authTab==='login'){
      var email=S.loginForm.email,pw=S.loginForm.password;
      if(!email||!pw){toast('Fill in all fields','error');return;}
      S.user={username:email.split('@')[0]||'Trader',email:email,completedTrades:0,rating:'New'};
      S.page='p2p';render();toast('Signed in! 🎉');
    } else {
      var un=S.signupForm.username,em=S.signupForm.email,pw2=S.signupForm.password;
      if(!un||!em||!pw2){toast('Fill in all fields','error');return;}
      if(pw2.length<8){toast('Password must be 8+ chars','error');return;}
      S.user={username:un,email:em,completedTrades:0,rating:'New'};
      S.page='p2p';render();toast('Account created! 🎉');
    }
  });
  // p2p
  e=document.getElementById('p2p-buy'); if(e) e.addEventListener('click',function(){S.p2pTab='buy';render();});
  e=document.getElementById('p2p-sell'); if(e) e.addEventListener('click',function(){S.p2pTab='sell';render();});
  document.querySelectorAll('[data-coin]').forEach(function(el){
    el.addEventListener('click',function(){S.p2pCoin=el.dataset.coin;render();});
  });
  // offer cards
  document.querySelectorAll('[data-offer]').forEach(function(el){
    el.addEventListener('click',function(ev){
      if(ev.target.dataset.trade) return;
      if(!S.user){S.page='auth';render();return;}
      var o=S.offers.find(function(x){return x.id===el.dataset.offer;});
      if(o){S.activeOffer=o;S.tradeModal=true;S.tradeForm={amount:'',payMethod:o.payMethods[0]};render();}
    });
  });
  document.querySelectorAll('[data-trade]').forEach(function(el){
    el.addEventListener('click',function(ev){
      ev.stopPropagation();
      if(!S.user){S.page='auth';render();return;}
      var o=S.offers.find(function(x){return x.id===el.dataset.trade;});
      if(o){S.activeOffer=o;S.tradeModal=true;S.tradeForm={amount:'',payMethod:o.payMethods[0]};render();}
    });
  });
  // trade modal
  e=document.getElementById('modal-overlay'); if(e) e.addEventListener('click',function(ev){if(ev.target===e){S.tradeModal=false;render();}});
  e=document.getElementById('close-modal'); if(e) e.addEventListener('click',function(){S.tradeModal=false;render();});
  e=document.getElementById('trade-amount'); if(e) e.addEventListener('input',function(ev){S.tradeForm.amount=ev.target.value;render();});
  e=document.getElementById('trade-pay'); if(e) e.addEventListener('change',function(ev){S.tradeForm.payMethod=ev.target.value;render();});
  e=document.getElementById('confirm-trade'); if(e) e.addEventListener('click',function(){
    var o=S.activeOffer,amt=parseFloat(S.tradeForm.amount);
    var trade={
      id:'TRD-'+Date.now().toString(36).toUpperCase(),
      type:o.type,coin:o.coin,
      fiatAmt:amt.toFixed(2),cryptoAmt:(amt/o.price).toFixed(8),
      fee:(amt*0.005).toFixed(2),rate:o.price,
      payMethod:S.tradeForm.payMethod,counterparty:o.username,
      status:'created',role:'buyer',messages:[],
      date:new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})
    };
    S.trades.unshift(trade);S.escrowTrade=trade;S.tradeModal=false;S.page='escrow';
    render();toast('Escrow opened! 🔐 '+trade.id);
  });
  // escrow
  e=document.getElementById('lock-escrow'); if(e) e.addEventListener('click',function(){S.escrowTrade.status='locked';upTrade();render();toast('Locked in escrow! 🔐');});
  e=document.getElementById('confirm-paid'); if(e) e.addEventListener('click',function(){S.escrowTrade.status='paid';upTrade();render();toast('Payment confirmed! ⏳');});
  e=document.getElementById('release-escrow'); if(e) e.addEventListener('click',function(){S.escrowTrade.status='released';upTrade();render();toast('Trade complete! 🎉');});
  e=document.getElementById('open-dispute'); if(e) e.addEventListener('click',function(){S.escrowTrade.status='disputed';upTrade();render();toast('Dispute opened ⚠️','error');});
  e=document.getElementById('back-p2p'); if(e) e.addEventListener('click',function(){S.page='p2p';render();});
  // trade chat
  e=document.getElementById('chat-send'); if(e) e.addEventListener('click',sendChat);
  e=document.getElementById('chat-input'); if(e) e.addEventListener('keydown',function(ev){if(ev.key==='Enter'){ev.preventDefault();sendChat();}});
  // trade view
  document.querySelectorAll('[data-trade-view]').forEach(function(el){
    el.addEventListener('click',function(){
      var t=S.trades.find(function(x){return x.id===el.dataset.tradeView;});
      if(t){S.escrowTrade=t;S.page='escrow';render();}
    });
  });
  // post offer
  e=document.getElementById('create-offer'); if(e) e.addEventListener('click',function(){if(!S.user){S.page='auth';render();return;}S.postModal=true;render();});
  e=document.getElementById('close-post'); if(e) e.addEventListener('click',function(){S.postModal=false;render();});
  e=document.getElementById('po-type'); if(e) e.addEventListener('change',function(ev){S.postForm.type=ev.target.value;render();});
  e=document.getElementById('po-coin'); if(e) e.addEventListener('change',function(ev){S.postForm.coin=ev.target.value;render();});
  e=document.getElementById('po-price'); if(e) e.addEventListener('input',function(ev){S.postForm.price=ev.target.value;});
  e=document.getElementById('po-min'); if(e) e.addEventListener('input',function(ev){S.postForm.min=ev.target.value;});
  e=document.getElementById('po-max'); if(e) e.addEventListener('input',function(ev){S.postForm.max=ev.target.value;});
  document.querySelectorAll('.po-pay').forEach(function(el){
    el.addEventListener('click',function(){
      var m=el.dataset.pay,arr=S.postForm.payMethods,i=arr.indexOf(m);
      if(i>=0) arr.splice(i,1); else arr.push(m);
      render();
    });
  });
  e=document.getElementById('submit-post'); if(e) e.addEventListener('click',function(){
    var f=S.postForm;
    if(!f.price||!f.min||!f.max){toast('Fill in all fields','error');return;}
    if(parseFloat(f.min)>=parseFloat(f.max)){toast('Min must be less than Max','error');return;}
    if(!f.payMethods.length){toast('Pick a payment method','error');return;}
    var no={id:'OFF-'+Math.random().toString(36).substr(2,6).toUpperCase(),
      type:f.type,coin:f.coin,price:parseFloat(f.price),
      minAmount:parseFloat(f.min),maxAmount:parseFloat(f.max),
      payMethods:f.payMethods.slice(),username:S.user.username,
      trades:0,completion:100,rating:5.0,avgTime:15,online:true};
    S.offers.unshift(no);S.postModal=false;S.p2pCoin=no.coin;S.p2pTab=no.type;S.page='p2p';
    render();toast('Offer posted! 🎉');
  });
  // profile
  e=document.getElementById('logout-btn'); if(e) e.addEventListener('click',function(){S.user=null;S.page='landing';render();toast('Logged out','info');});
  e=document.getElementById('go-p2p'); if(e) e.addEventListener('click',function(){S.page='p2p';render();});
  // rating
  e=document.getElementById('open-rating'); if(e) e.addEventListener('click',function(){S.ratingModal=true;S.pendingRating=0;render();});
  e=document.getElementById('close-rating'); if(e) e.addEventListener('click',function(){S.ratingModal=false;render();});
  e=document.getElementById('submit-rating'); if(e) e.addEventListener('click',function(){S.ratingModal=false;toast('Rated ⭐ '+S.pendingRating+'/5');render();});
  document.querySelectorAll('.rating-star').forEach(function(el){
    el.addEventListener('click',function(){S.pendingRating=parseInt(el.dataset.star);render();});
  });
  // notif
  e=document.getElementById('close-notif'); if(e) e.addEventListener('click',function(){S.notifOpen=false;render();});
  // scroll chat
  var cm=document.getElementById('chat-msgs'); if(cm) cm.scrollTop=cm.scrollHeight;
}

function sendChat(){
  var el=document.getElementById('chat-input');
  if(!el||!el.value.trim()) return;
  if(!S.escrowTrade.messages) S.escrowTrade.messages=[];
  S.escrowTrade.messages.push({from:S.user?S.user.username:'You',text:el.value.trim(),time:new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})});
  upTrade();el.value='';render();
}

function upTrade(){
  var i=S.trades.findIndex(function(t){return t.id===S.escrowTrade.id;});
  if(i>=0) S.trades[i]=S.escrowTrade;
}

// ── INIT ───────────────────────────────────────────────────
if(tgUser){
  S.user={id:tgUser.id,username:tgUser.username||tgUser.first_name||'TGUser',email:'tg@user',completedTrades:0,rating:'New'};
  S.page='p2p';
} else {
  S.page='landing';
}

render();

setInterval(function(){
  COINS.forEach(function(c){PRICES[c]=+(PRICES[c]*(1+(Math.random()-.5)*.004)).toFixed(c==='USDT'?4:2);});
  if(S.page==='p2p'&&!S.tradeModal) render();
},15000);
</script>
</body>
</html>
